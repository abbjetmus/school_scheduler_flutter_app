name: school_scheduler_flutter_app
description: "Skolpunkten Bibliotek — Windows-appen i biblioteket: låna ut och ta emot böcker genom att blippa RFID-etiketter och lånekort."
publish_to: 'none'

version: 1.0.0+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_compositions: ^0.1.1
  go_router: ^17.0.1
  pocketbase: ^0.23.2
  url_launcher: ^6.2.6
  intl: ^0.20.2
  shared_preferences: ^2.3.4
  # PC/SC-läsare (USB) i Windows — t.ex. ACR1552U som läser både bibliotekets
  # RFID-etiketter (ISO 15693) och passerkort (ISO 14443).
  dart_pcsc: ^2.0.2
  audioplayers: ^6.1.0
  google_fonts: ^6.2.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
